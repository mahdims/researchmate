# LLM Model Configuration
# This file defines which LLM models to use for each processing stage.
# Each model can be configured with provider, model_name, temperature, and max_tokens.
# Providers: "deepseek", "gemini", "openai", "anthropic" (key env vars: DEEPSEEK_API_KEY,
# GEMINI_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY).
# DeepSeek only: `thinking: true` enables reasoning mode (off unless set; temperature is ignored when on).

# Layer 0: Fetch and score
# Used for relevance scoring of papers (0-10 scale) with researcher context
layer0:
  relevance_scorer:
    provider: "deepseek"  # Options: "deepseek", "gemini", "openai", "anthropic"
    model_name: "deepseek-flash"
    # Thinking on: in a 2026-11-24 eval on 80 papers it raised agreement with a
    # deepseek-v4-pro+thinking judge from 89% to 95% (precision 73% -> 100%), ~$0.0007/paper.
    thinking: true
    temperature: 0.0
    max_tokens: 0  # Short structured output (just a score)
    structured_output: true  # Use structured output for reliable JSON parsing

# Layer 1: Deep paper analysis
# Multi-agent pipeline for extracting detailed understanding from PDFs
layer1:
  reader:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.0
    max_tokens: 0  # 0 = no limit, let model decide

  methods_extractor:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.0
    max_tokens: 0

  positioning:
    provider: "deepseek"
    # Hardest judgment step -> stronger model with reasoning. deepseek-v4-pro was
    # unreliable with thinking off in testing (2026-11-24), so keep thinking on.
    model_name: "deepseek-v4-pro"
    thinking: true
    temperature: 0.0
    max_tokens: 0

# Layer 2: Bibliometric front detection
# Used for summarizing research fronts detected through citation analysis
layer2:
  front_summarizer:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.3  # Slightly creative for trend descriptions
    max_tokens: 0

  embedding:
    model_name: "text-embedding-3-large"  # OpenAI best embedding model
    batch_size: 100
    # --- Three independent tuning knobs ---
    cosine_threshold: 0.60      # Min cosine to register embedding similarity; removes ~0.65 domain baseline
    embedding_weight: 0.90       # Embedding's share of the 0-1 score vs tag signals  (0=tags only, 1=embedding only)
    semantic_edge_weight: 5.0    # How much all semantic edges count vs citation edges (1=equal, 2=double, 0=disable)

# Layer 3: Living reviews and email generation
# Used for maintaining living literature reviews with daily/weekly/monthly cycles
layer3:
  daily_updater:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.3
    max_tokens: 8000

  weekly_revisor:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.3
    max_tokens: 8000

  monthly_rewriter:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.5  # More creative for major restructuring
    max_tokens: 8000

  email_generator:
    provider: "deepseek"
    model_name: "deepseek-flash"
    temperature: 0.5
    max_tokens: 0

# Cost estimates (per 1M tokens, as of 2026-02)
# Used for budgeting and cost tracking
cost_per_million_tokens:
  # DeepSeek: peak cache-miss input / output, from api-docs.deepseek.com/quick_start/pricing (2026-11-24).
  # Off-peak is half price (peak = 01:00-04:00 and 06:00-10:00 UTC, Mon-Fri).
  "deepseek-flash":
    input: 0.30
    output: 1.20
  "deepseek-v4-pro":
    input: 1.32
    output: 3.96

  # Gemini
  "gemini-3-flash-preview":
    input: 0.5
    output: 3.0
  "gemini-2.5-flash":
    input: 0.3
    output: 2.5
  "gemini-2.5-flash-lite":
    input: 0.1
    output: 0.40
  "gemini-2.5-pro":
    input: 1.25
    output: 10.00
  "gemini-3.1-pro-preview":
    input: 2.0
    output: 12.00

  # Anthropic Claude
  "claude-sonnet-4-5-20250929":
    input: 3.00
    output: 15.00
  "claude-haiku-4-5-20251001":
    input: 0.80
    output: 4.00

  # OpenAI
  "gpt-5-nano":
    input: 0.10
    output: 0.30
  "gpt-4o":
    input: 2.50
    output: 10.00
  "gpt-4o-mini":
    input: 0.15
    output: 0.60
  "text-embedding-3-large":
    input: 0.13   # $0.13/1M tokens (as of 2026-02). ~$0.003 per 100-paper corpus. Subsequent runs: $0.
    output: 0.0
